openapi: 3.1.0
info:
  title: SiteCare API
  version: 1.0.0
  description: SiteCare REST API. Authentication uses Sanctum session cookies and CSRF for stateful browser requests.
servers:
  - url: http://localhost:8000/api
paths:
  /health:
    get:
      summary: API health
      responses:
        '200': {description: Healthy}
  /v1/auth/login:
    post:
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200': {description: Signed in}
        '422': {description: Invalid credentials or input}
  /v1/auth/forgot-password:
    post:
      summary: Request a password reset email
      responses: {'202': {description: Generic response to prevent account enumeration}}
  /v1/auth/reset-password:
    post:
      summary: Replace a password using a single-use reset token
      responses: {'200': {description: Password reset}, '422': {description: Invalid or expired token}}
  /v1/auth/profile:
    patch:
      security: [{cookieAuth: []}]
      summary: Update the current user's profile and optionally password
      responses: {'200': {description: Updated profile}, '422': {description: Validation or current-password error}}
  /v1/auth/me:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Current user}}
  /v1/auth/logout:
    post:
      security: [{cookieAuth: []}]
      responses: {'204': {description: Signed out}}
  /v1/invitations:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Pending invitations; administrators only}}
    post:
      security: [{cookieAuth: []}]
      responses: {'201': {description: Invitation created and email queued; administrators only}}
  /v1/invitations/accept:
    post:
      summary: Accept a valid single-use invitation
      responses: {'201': {description: Account created}}
  /v1/invitations/{invitation}:
    delete:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: invitation
          required: true
          schema: {type: integer}
      responses: {'204': {description: Invitation revoked}}
  /v1/organisations:
    get:
      security: [{cookieAuth: []}]
      summary: List client organisations (administrators only)
      responses: {'200': {description: Paginated organisations with user, website and ticket counts}}
    post:
      security: [{cookieAuth: []}]
      summary: Create a client organisation (administrators only)
      responses: {'201': {description: Organisation created}}
  /v1/organisations/{organisation}:
    patch:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: organisation
          required: true
          schema: {type: integer}
      responses: {'200': {description: Organisation details or active/suspended state updated}}
  /v1/team:
    get:
      security: [{cookieAuth: []}]
      summary: List team members (administrators only)
      responses: {'200': {description: Paginated team directory}}
  /v1/team/{member}:
    patch:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: member
          required: true
          schema: {type: integer}
      responses: {'200': {description: Team member role updated}}
  /v1/audit-logs:
    get:
      security: [{cookieAuth: []}]
      summary: List the administrative audit history
      responses: {'200': {description: Paginated audit history; administrators only}}
  /v1/notifications:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Current user's notifications}}
  /v1/notifications/{notification}:
    patch:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: notification
          required: true
          schema: {type: string, format: uuid}
      responses: {'200': {description: Notification marked read}}
  /v1/notification-preferences:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Current user's notification preferences}}
    patch:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Notification preferences updated}}
  /v1/dashboard:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Organisation-scoped overview}}
  /v1/websites:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Scoped paginated websites}}
    post:
      security: [{cookieAuth: []}]
      responses: {'201': {description: Website submitted for review}}
  /v1/websites/{website}:
    patch:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: website
          required: true
          schema: {type: integer}
      responses: {'200': {description: Website reviewed by an administrator}}
  /v1/websites/{website}/health:
    get:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: website
          required: true
          schema: {type: integer}
      responses: {'200': {description: Scoped uptime, SSL and incident history}}
  /v1/websites/{website}/check:
    post:
      security: [{cookieAuth: []}]
      summary: Queue an authorized manual health and SSL check
      parameters:
        - in: path
          name: website
          required: true
          schema: {type: integer}
      responses: {'202': {description: Check queued for staff on an active website}}
  /v1/websites/{website}/backups:
    get:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: website
          required: true
          schema: {type: integer}
      responses: {'200': {description: Scoped backup history}}
    post:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: website
          required: true
          schema: {type: integer}
      responses: {'201': {description: Backup record created by staff}}
  /v1/websites/{website}/backup-webhook-secret:
    post:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: website
          required: true
          schema: {type: integer}
      responses: {'200': {description: Rotated secret, shown once}}
  /v1/websites/{website}/maintenance:
    get:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: website
          required: true
          schema: {type: integer}
      responses: {'200': {description: Visible maintenance history}}
    post:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: website
          required: true
          schema: {type: integer}
      responses: {'201': {description: Maintenance record created by staff}}
  /v1/tickets:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Scoped paginated tickets}}
    post:
      security: [{cookieAuth: []}]
      responses: {'201': {description: Ticket created}}
  /v1/ticket-categories:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Active categories, or all categories for administrators}}
    post:
      security: [{cookieAuth: []}]
      responses: {'201': {description: Administrator created a category}}
  /v1/ticket-categories/{category}:
    patch:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: category
          required: true
          schema: {type: integer}
      responses: {'200': {description: Administrator renamed or activated a category}}
  /v1/tickets/{ticket}:
    patch:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: ticket
          required: true
          schema: {type: integer}
      responses: {'200': {description: Ticket updated}}
  /v1/tickets/{ticket}/comments:
    get:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: ticket
          required: true
          schema: {type: integer}
      responses: {'200': {description: Visible comments}}
    post:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: ticket
          required: true
          schema: {type: integer}
      responses: {'201': {description: Comment added}}
  /v1/tickets/{ticket}/history:
    get:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: ticket
          required: true
          schema: {type: integer}
      responses: {'200': {description: Status, priority and assignment history}}
  /v1/tickets/{ticket}/attachments:
    get:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: ticket
          required: true
          schema: {type: integer}
      responses: {'200': {description: Attachments available to ticket participants}}
    post:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: ticket
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses: {'201': {description: Private ticket attachment stored}}
  /v1/attachments/{attachment}:
    get:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: attachment
          required: true
          schema: {type: integer}
      responses: {'200': {description: Authorized attachment download}, '404': {description: Missing or inaccessible attachment}}
  /v1/incidents:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Tenant- or assignment-scoped incidents}}
  /v1/incidents/{incident}:
    patch:
      security: [{cookieAuth: []}]
      parameters:
        - in: path
          name: incident
          required: true
          schema: {type: integer}
      responses: {'200': {description: Incident acknowledged by staff}}
  /v1/webhooks/websites/{website}/backups:
    post:
      summary: Submit a backup event signed with the website secret
      parameters:
        - in: path
          name: website
          required: true
          schema: {type: integer}
        - in: header
          name: X-SiteCare-Timestamp
          required: true
          schema: {type: string}
        - in: header
          name: X-SiteCare-Event-Id
          required: true
          schema: {type: string}
        - in: header
          name: X-SiteCare-Signature
          required: true
          schema: {type: string}
      responses:
        '201': {description: Backup event accepted}
        '401': {description: Invalid signature or timestamp}
        '409': {description: Replayed event id}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sitecare_session
